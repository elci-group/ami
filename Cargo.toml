[package]
name = "ami"
version = "0.1.9"
edition = "2021"
description = "Addressable Market Identifier - Deterministically discovers, scores, and tracks potential adopters for a project"
license = "MIT"
repository = "https://github.com/sal/ami"

[lib]
name = "ami"
path = "src/lib.rs"

[[bin]]
name = "ami"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
toml = "0.8"
serde_yaml = "0.9"
git2 = "0.18"
reqwest = { version = "0.12", features = ["json"] }
scraper = "0.19"
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
urlencoding = "2.1"
form3 = { path = "../3form" }

[dev-dependencies]
tempfile = "3.10"
